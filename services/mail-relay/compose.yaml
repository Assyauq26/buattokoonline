name: btos-mail-relay
services:
  relay:
    image: ${MAIL_RELAY_IMAGE:?Set an immutable image digest built from the reviewed commit}
    restart: unless-stopped
    env_file: /etc/btos-mail-relay/runtime.env
    environment:
      MAIL_RELAY_BIND: 0.0.0.0
      MAIL_RELAY_DB: /data/mail.sqlite
    volumes:
      - /var/lib/btos-mail-relay:/data
    networks: [operator, platform]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    stop_grace_period: 25s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8092/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
networks:
  platform:
    external: true
    name: btos-platform_web
  operator:
    external: true
    name: btos-mail-operator
