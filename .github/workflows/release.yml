name: Package stable release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require matching stable version
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          python3 -m unittest discover -s tests -p '*_test.py'
          node tests/repository-boundary.mjs
      - name: Package tracked source and migration inventory
        run: python3 installer/release.py "store-${GITHUB_REF_NAME}.tar.gz"
      - name: Create draft release for operator review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "store-${GITHUB_REF_NAME}.tar.gz" --verify-tag --draft --generate-notes
