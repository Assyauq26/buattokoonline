name: Deploy to Hubify staging
on:
  workflow_dispatch:
    inputs:
      exact_sha:
        description: 'Exact 40-character HEAD commit SHA of main'
        type: string
        required: true
      confirmation:
        description: 'Type DEPLOY HUBIFY to acknowledge staging downtime'
        type: string
        required: true
      operation:
        description: 'Reviewed executor; staging guard remains unchanged'
        type: choice
        default: staging
        options: [staging, promotions-v180]
      artifact_sha256:
        description: 'Exact preflighted v1.8.0 artifact digest (promotions-v180 only)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: hubify-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy manually authorized main SHA to Hubify
    if: github.repository == 'Assyauq26/buattokoonline' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: hubify-staging
    steps:
      - name: Verify exact main SHA (CI is optional)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.exact_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          OPERATION: ${{ inputs.operation }}
          DIGEST: ${{ inputs.artifact_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == 'DEPLOY HUBIFY' ]]
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OPERATION" == 'staging' || "$OPERATION" == 'promotions-v180' ]]
          if [[ "$OPERATION" == 'promotions-v180' ]]; then [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]]; fi
          REPO=$(gh api "repos/$GITHUB_REPOSITORY" --jq .full_name)
          test "$REPO" = 'Assyauq26/buattokoonline'
          HEAD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$HEAD_SHA" = "$SHA"
          echo "Authorized exact main SHA $SHA; no CI-success requirement."
      - name: Deploy via pinned SSH host and restricted server helper
        env:
          SHA: ${{ inputs.exact_sha }}
          OPERATION: ${{ inputs.operation }}
          DIGEST: ${{ inputs.artifact_sha256 }}
          SSH_KEY: ${{ secrets.HUBIFY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HUBIFY_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$HOME/.ssh/hubify_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/hubify_deploy" "$HOME/.ssh/known_hosts"
          grep -Eq '^43[.]173[.]41[.]24 ssh-ed25519 ' "$HOME/.ssh/known_hosts"
          if [[ "$OPERATION" == 'promotions-v180' ]]; then
            HELPER=/usr/local/sbin/hubify-promotions-cutover
            [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]]
          else
            HELPER=/usr/local/sbin/hubify-staging-deploy
            DIGEST=''
          fi
          ssh -T -i "$HOME/.ssh/hubify_deploy" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            hubifydeploy@43.173.41.24 \
            sudo -n "$HELPER" "$SHA" ${DIGEST:+"$DIGEST"}
