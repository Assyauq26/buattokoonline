name: Deploy to Hubify staging
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: hubify-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the current main commit to Hubify
    if: >-
      github.repository == 'Assyauq26/buattokoonline' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.HUBIFY_AUTO_DEPLOY == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: hubify-staging
      url: https://hubify.web.id
    steps:
      - name: Deploy via pinned SSH host and restricted server helper
        env:
          SHA: ${{ github.sha }}
          SSH_KEY: ${{ secrets.HUBIFY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HUBIFY_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$HOME/.ssh/hubify_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/hubify_deploy" "$HOME/.ssh/known_hosts"
          grep -Eq '^43[.]173[.]41[.]24 ssh-ed25519 ' "$HOME/.ssh/known_hosts"
          ssh -T -i "$HOME/.ssh/hubify_deploy" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            hubifydeploy@43.173.41.24 \
            sudo -n /usr/local/sbin/hubify-staging-deploy --main "$SHA"
