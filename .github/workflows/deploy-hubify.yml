name: Deploy to Hubify staging
on:
  workflow_dispatch:
    inputs:
      exact_sha:
        description: 'Exact 40-character HEAD commit SHA of main'
        type: string
        required: true
      confirmation:
        description: 'Type DEPLOY HUBIFY to acknowledge staging downtime'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: hubify-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy manually authorized main SHA to Hubify
    if: github.repository == 'Assyauq26/buattokoonline' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: hubify-staging
    steps:
      - name: Verify exact main SHA (CI is optional)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.exact_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == 'DEPLOY HUBIFY' ]]
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          REPO=$(gh api "repos/$GITHUB_REPOSITORY" --jq .full_name)
          test "$REPO" = 'Assyauq26/buattokoonline'
          HEAD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$HEAD_SHA" = "$SHA"
          echo "Authorized exact main SHA $SHA; no CI-success requirement."
      - name: Deploy via pinned SSH host and restricted server helper
        env:
          SHA: ${{ inputs.exact_sha }}
          SSH_KEY: ${{ secrets.HUBIFY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HUBIFY_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/hubify_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/hubify_deploy" "$HOME/.ssh/known_hosts"
          grep -Eq '^43[.]173[.]41[.]24 ssh-ed25519 ' "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/hubify_deploy" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            hubifydeploy@43.173.41.24 \
            sudo -n /usr/local/sbin/hubify-staging-deploy "$SHA"
